# Command API (uploads, applies migrations at startup: keep a single replica) and Query API (documents, questions).
# Both read the PostgreSQL connection string from Key Vault and reach Azure services with workload identity;
# the non-secret endpoints come from the docquery-config ConfigMap generated by the overlay.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: command-api
  namespace: docquery
  labels:
    app.kubernetes.io/name: command-api
    app.kubernetes.io/part-of: docquery
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: command-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: command-api
        app.kubernetes.io/part-of: docquery
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: docquery
      containers:
        - name: command-api
          image: docquery/command-api:latest
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: docquery-config
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Production
            - name: BlobStorage__CreateContainerOnStartup
              value: "false"
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /alive
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: command-api
  namespace: docquery
spec:
  selector:
    app.kubernetes.io/name: command-api
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: query-api
  namespace: docquery
  labels:
    app.kubernetes.io/name: query-api
    app.kubernetes.io/part-of: docquery
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: query-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: query-api
        app.kubernetes.io/part-of: docquery
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: docquery
      containers:
        - name: query-api
          image: docquery/query-api:latest
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: docquery-config
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Production
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /alive
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: query-api
  namespace: docquery
spec:
  selector:
    app.kubernetes.io/name: query-api
  ports:
    - name: http
      port: 8080
      targetPort: http
