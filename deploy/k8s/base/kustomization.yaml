# Environment-independent manifests. Overlays set the images, the workload identity client id and the
# docquery-config ConfigMap (Azure endpoints); see overlays/dev.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - apis.yaml
  - workers.yaml
  - web.yaml
  - ingress.yaml
