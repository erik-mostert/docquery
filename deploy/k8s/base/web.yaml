# Static UI served by nginx; talks to the APIs through the same ingress (relative /api paths), so no CORS.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: docquery
  labels:
    app.kubernetes.io/name: web
    app.kubernetes.io/part-of: docquery
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: web
        app.kubernetes.io/part-of: docquery
    spec:
      containers:
        - name: web
          image: docquery/web:latest
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: docquery
spec:
  selector:
    app.kubernetes.io/name: web
  ports:
    - name: http
      port: 80
      targetPort: http
